# OPTIONAL: Docker is not required for the recommended Supabase PostgreSQL workflow.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ahad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./cms/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:1337:1337"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cms
    ports:
      - "127.0.0.1:8080:80"

volumes:
  ahad_postgres_data:
